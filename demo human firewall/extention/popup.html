<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aware Guard</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ─── Header ───────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #1e293b;
      background: #0f172a;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 18px;
      line-height: 1;
    }

    .brand-name {
      font-weight: 700;
      font-size: 14px;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }

    .brand-version {
      font-size: 10px;
      color: #64748b;
      margin-top: 1px;
    }

    /* Status indicator */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1e293b;
      border-radius: 20px;
      padding: 3px 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    .status-label {
      font-size: 11px;
      color: #94a3b8;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ─── Body ─────────────────────────────────────────────────────────────── */
    .body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ─── Result Panel ─────────────────────────────────────────────────────── */
    .result-panel {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Verdict row */
    .verdict-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .verdict-icon {
      font-size: 18px;
      line-height: 1;
    }

    .verdict-info {
      flex: 1;
    }

    .verdict-label {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .verdict-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 1px;
    }

    /* Score bar */
    .score-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-title {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .score-value {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }

    .score-track {
      height: 5px;
      background: #0f172a;
      border-radius: 3px;
      overflow: hidden;
    }

    .score-bar {
      height: 100%;
      border-radius: 3px;
      background: #10b981;
      transition: width 0.4s ease, background 0.3s ease;
      width: 0%;
    }

    /* Email subject */
    .email-meta {
      border-top: 1px solid #0f172a;
      padding-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .meta-label {
      font-size: 10px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .meta-subject {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-time {
      font-size: 10px;
      color: #475569;
    }

    /* ─── Empty State ───────────────────────────────────────────────────────── */
    .empty-state {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .empty-icon {
      font-size: 28px;
      opacity: 0.5;
    }

    .empty-title {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
    }

    .empty-sub {
      font-size: 11px;
      color: #475569;
    }

    /* ─── Buttons ───────────────────────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.2); }

    /* ─── Report Status ─────────────────────────────────────────────────────── */
    .report-status {
      font-size: 11px;
      color: #10b981;
      text-align: center;
      padding: 4px 0;
      display: none;
    }

    /* ─── Footer ───────────────────────────────────────────────────────────── */
    .footer {
      padding: 8px 14px 10px;
      border-top: 1px solid #1e293b;
      font-size: 10px;
      color: #334155;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <div class="header">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div>
        <div class="brand-name">Aware Guard</div>
        <div class="brand-version">v2.0 · AI Phishing Detection</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-text">Active</span>
    </div>
  </div>

  <!-- ── Body ────────────────────────────────────────────────────────────── -->
  <div class="body">

    <!-- Result Panel (shown when a scan exists) -->
    <div class="result-panel" id="result-panel" style="display:none">

      <!-- Verdict -->
      <div class="verdict-row">
        <span class="verdict-icon" id="verdict-icon">🔍</span>
        <div class="verdict-info">
          <div class="verdict-label" id="verdict-label" style="color:#10b981">—</div>
          <div class="verdict-sub" id="scan-subject">No subject</div>
        </div>
      </div>

      <!-- Risk Score Bar -->
      <div class="score-section">
        <div class="score-header">
          <span class="score-title">Risk Score</span>
          <span class="score-value" id="score-value">0/100</span>
        </div>
        <div class="score-track">
          <div class="score-bar" id="score-bar"></div>
        </div>
      </div>

      <!-- Email Meta -->
      <div class="email-meta">
        <div class="meta-label">Last Scanned</div>
        <div class="meta-time" id="scan-time">—</div>
      </div>

    </div>

    <!-- Empty State (shown when no scan yet) -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📬</div>
      <div class="empty-title">No Scan Yet</div>
      <div class="empty-sub">Open an email in Gmail and click Scan Now, or wait for auto-detection.</div>
    </div>

    <!-- Scan Button -->
    <button class="btn btn-primary" id="scan-btn">
      🔍 Scan Now
    </button>

    <!-- Report Phishing Button (only shown for SUSPICIOUS/PHISHING results) -->
    <button class="btn btn-danger" id="report-btn" style="display:none">
      🚩 Report Phishing
    </button>

    <!-- Report Status Message -->
    <div class="report-status" id="report-status"></div>

  </div>

  <!-- ── Footer ──────────────────────────────────────────────────────────── -->
  <div class="footer">
    Aware Guard · Protecting your inbox with AI
  </div>

  <script src="popup.js"></script>

</body>
</html>
